[workspace]
name = "dtsgui"
version = "1.0.0"
description = ""
channels = ["conda-forge"]
platforms = ["win-64", "osx-64", "linux-64"]

[tasks]
run = "python dts_app.py"
test = "pytest tests/ -v"

[dependencies]
# --- Core runtime ---
python = "3.13.*"
pip = "*"
setuptools = "*"
wheel = "*"

# --- Data & science ---
numpy = "*"
pandas = "*"
h5py = "*"
matplotlib = "*"

# --- Geospatial ---
gdal = "*"

# --- GUI ---
wxpython = ">=4.2"

# --- Networking ---
requests = "*"

# --- Jupyter ---
jupyter = "*"
ipywidgets = "*"

# --- Documentation ---
sphinx = "*"

# --- Code quality & Testing ---
pylint = "*"
autopep8 = "*"
pytest = "*"

# --- PyPI dependencies ---
[pypi-dependencies]
altgraph = "*"
colorama = "*"
decorator = "*"
macholib = "*"
pefile = "*"
pyinstaller = "*"
python-dateutil = "*"
