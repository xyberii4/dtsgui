name: Baseline Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dts/**'
      - 'tests/baseline/**'
      - 'samples/quashnet/**'
      - 'samples/santuit/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/test-baseline.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'dts/**'
      - 'tests/baseline/**'
      - 'samples/quashnet/**'
      - 'samples/santuit/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/test-baseline.yml'
  workflow_dispatch:

jobs:
  test-baseline:
    name: Run Baseline Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          
      - name: Run Baseline Tests
        run: pixi run test-baseline
